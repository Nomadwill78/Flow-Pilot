services:
  - type: web
    name: flowpilot-server
    runtime: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CLIENT_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health
